<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc"><title id="title">Incident creation and reopening sequence</title><desc id="desc">A monitor selects map evidence, the API validates access, saves source snapshots in a configuration transaction, and later restores an authorised link and client exports.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#21312d"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="35" y="49" fill="#21312d" font-size="29" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="35" dy="0">Incidents: create, reopen and export</tspan></text>
<text x="35" y="83" fill="#5c6b66" font-size="18" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="35" dy="0">Source-backed flow · configuration writes are atomic; warehouse reads are separate</tspan></text>
<rect x="5" y="115" width="210" height="66" rx="8" fill="#f7f9f7" stroke="#21312d" stroke-width="2"/>
<text x="19" y="144" fill="#21312d" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="19" dy="0">Community</tspan><tspan x="19" dy="22.1">monitor</tspan></text>
<line x1="110" y1="182" x2="110" y2="1595" stroke="#bcc8c1" stroke-width="2"  stroke-dasharray="6 5"/>
<rect x="260" y="115" width="210" height="66" rx="8" fill="#f7f9f7" stroke="#21312d" stroke-width="2"/>
<text x="274" y="144" fill="#21312d" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="274" dy="0">Alerts dashboard</tspan></text>
<line x1="365" y1="182" x2="365" y2="1595" stroke="#bcc8c1" stroke-width="2"  stroke-dasharray="6 5"/>
<rect x="560" y="115" width="210" height="66" rx="8" fill="#f7f9f7" stroke="#21312d" stroke-width="2"/>
<text x="574" y="144" fill="#21312d" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="574" dy="0">Nuxt incidents</tspan><tspan x="574" dy="22.1">API</tspan></text>
<line x1="665" y1="182" x2="665" y2="1595" stroke="#bcc8c1" stroke-width="2"  stroke-dasharray="6 5"/>
<rect x="875" y="115" width="210" height="66" rx="8" fill="#f7f9f7" stroke="#21312d" stroke-width="2"/>
<text x="889" y="144" fill="#21312d" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="889" dy="0">Warehouse DB</tspan></text>
<line x1="980" y1="182" x2="980" y2="1595" stroke="#bcc8c1" stroke-width="2"  stroke-dasharray="6 5"/>
<rect x="1190" y="115" width="210" height="66" rx="8" fill="#e8f5ee" stroke="#188568" stroke-width="2"/>
<text x="1204" y="144" fill="#21312d" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="1204" dy="0">Configuration</tspan><tspan x="1204" dy="22.1">DB</tspan></text>
<line x1="1295" y1="182" x2="1295" y2="1595" stroke="#bcc8c1" stroke-width="2"  stroke-dasharray="6 5"/>
<line x1="110" y1="232" x2="365" y2="232" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="122" y="209" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="122" dy="0">Select sources and describe</tspan><tspan x="122" dy="16.900000000000002">incident</tspan></text>
<line x1="365" y1="286" x2="665" y2="286" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="377" y="263" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">POST /api/incidents: entries + parent</tspan><tspan x="377" dy="16.900000000000002">table</tspan></text>
<line x1="665" y1="340" x2="780" y2="340" stroke="#21312d" stroke-width="2"  />
<line x1="780" y1="340" x2="780" y2="352" stroke="#21312d" stroke-width="2"  />
<line x1="780" y1="352" x2="665" y2="352" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="673" y="318" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="673" dy="0">Member / session /</tspan><tspan x="673" dy="16.900000000000002">required name</tspan></text>
<line x1="665" y1="394" x2="1295" y2="394" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="371" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">BEGIN configuration transaction</tspan></text>
<line x1="665" y1="448" x2="1295" y2="448" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="425" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Insert collection + incident metadata</tspan></text>
<line x1="665" y1="502" x2="980" y2="502" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="479" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">For each entry: read source table / id</tspan></text>
<line x1="980" y1="556" x2="665" y2="556" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="677" y="533" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Source data, or no row</tspan></text>
<line x1="665" y1="610" x2="1295" y2="610" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="587" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Insert evidence entry + source_data snapshot</tspan></text>
<line x1="665" y1="664" x2="1295" y2="664" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="641" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">COMMIT; rollback writes if a step fails</tspan></text>
<line x1="665" y1="718" x2="365" y2="718" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="377" y="695" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">Created incident id</tspan></text>
<line x1="365" y1="772" x2="665" y2="772" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="377" y="749" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">GET list with parent_alerts_table</tspan></text>
<line x1="665" y1="826" x2="1295" y2="826" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="803" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Filter incident list by current view</tspan></text>
<line x1="665" y1="880" x2="365" y2="880" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="377" y="857" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">Saved list; clear selection only after</tspan><tspan x="377" dy="16.900000000000002">success</tspan></text>
<rect x="30" y="929" width="1380" height="35" rx="8" fill="#e8f5ee" stroke="#188568" stroke-width="2"/>
<text x="45" y="949" fill="#188568" font-size="15" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="45" dy="0">Reopen / share / export — normal access checks still apply</tspan></text>
<line x1="110" y1="1008" x2="365" y2="1008" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="122" y="985" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="122" dy="0">Open incidentId link</tspan></text>
<line x1="365" y1="1062" x2="665" y2="1062" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="377" y="1039" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">GET /api/incidents/:id</tspan></text>
<line x1="665" y1="1116" x2="1295" y2="1116" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="677" y="1093" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Read collection, incident and saved entries</tspan></text>
<line x1="1295" y1="1170" x2="665" y2="1170" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="677" y="1147" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="677" dy="0">Details + saved source snapshots</tspan></text>
<line x1="665" y1="1224" x2="365" y2="1224" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="377" y="1201" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="377" dy="0">Incident details + entries</tspan></text>
<line x1="365" y1="1278" x2="480" y2="1278" stroke="#21312d" stroke-width="2"  />
<line x1="480" y1="1278" x2="480" y2="1290" stroke="#21312d" stroke-width="2"  />
<line x1="480" y1="1290" x2="365" y2="1290" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="373" y="1256" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="373" dy="0">Set route; highlight; fit</tspan><tspan x="373" dy="16.900000000000002">map bounds</tspan></text>
<line x1="365" y1="1332" x2="110" y2="1332" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="122" y="1309" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="122" dy="0">Same record and evidence in view</tspan></text>
<line x1="110" y1="1386" x2="365" y2="1386" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" />
<text x="122" y="1363" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="122" dy="0">Download metadata / features</tspan></text>
<line x1="365" y1="1440" x2="110" y2="1440" stroke="#21312d" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="122" y="1417" fill="#21312d" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="122" dy="0">CSV / GeoJSON from loaded payload</tspan></text>
<text x="35" y="1615" fill="#5c6b66" font-size="17" font-family="ui-sans-serif,system-ui,sans-serif"><tspan x="35" dy="0">No incident-export API call is required. A shared URL is not a public access grant.</tspan></text>
</svg>
